<!DOCTYPE html><html><body><div id="log">pending</div><script>
const files=['images/menu/breakfast-foul.png','images/menu/manakish-zaatar.png'];
let out=[];
let done=0;
files.forEach(f=>{const i=new Image();i.onload=()=>{
  const c=document.createElement('canvas');c.width=i.width;c.height=i.height;
  const x=c.getContext('2d');x.drawImage(i,0,0);
  const pts=[[2,2],[i.width-3,2],[2,i.height-3],[i.width>>1,2]];
  out.push(f+' => '+pts.map(p=>{const d=x.getImageData(p[0],p[1],1,1).data;return d[0]+','+d[1]+','+d[2]+',a'+d[3]}).join(' | '));
  if(++done===files.length) document.getElementById('log').textContent=out.join('  ||  ');
};i.onerror=()=>{out.push(f+' ERROR');if(++done===files.length)document.getElementById('log').textContent=out.join(' || ');};i.src='/'+f;});
</script></body></html>
